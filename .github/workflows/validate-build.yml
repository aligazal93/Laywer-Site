
name: AliLaw Validate Production Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate proxy syntax
        run: |
          if [ -f src/proxy.js ]; then
            node --check src/proxy.js
          fi

      - name: Build Next.js
        run: npm run build
